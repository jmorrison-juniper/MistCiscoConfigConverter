name: CodeQL Analysis

on:
  # No branch filter here. A pull request against any base runs the scan, so a
  # required CodeQL check always reports.
  pull_request:
  push:
    branches: [main]
  schedule:
    # Run every Monday at 06:00 UTC, so new CodeQL queries examine the code.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A new commit cancels the previous run of a pull request. A `main` run gets a
# group of its own run ID, so a later run never cancels or replaces it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The job below states the permissions that it needs. The empty map here
# removes every other permission.
permissions: {}

jobs:
  # The shared workflow runs the analysis in its job named analyze. Code
  # scanning keys the alerts on this file path and that job ID. Do not rename
  # this file.
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-codeql.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      languages: '["python"]'
      config-file: ./.github/codeql/codeql-config.yml
